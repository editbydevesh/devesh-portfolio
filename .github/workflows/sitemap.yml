name: Regenerate sitemap and check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # daily at midnight UTC

jobs:
  regen-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate sitemap.gz
        run: |
          mkdir -p public
          gzip -9n -c public/sitemap.xml > /tmp/sitemap.xml.gz

      - name: Verify checked-in gzip matches regenerated output
        run: |
          cmp -s /tmp/sitemap.xml.gz public/sitemap.xml.gz || (echo "public/sitemap.xml.gz is out of date. Regenerate it locally and commit the updated file." && exit 1)

      - name: Check sitemap reachable (primary)
        run: |
          if curl -I --max-time 10 https://www.designsbydevesh.me/sitemap.xml; then echo 'sitemap reachable'; else echo 'primary unreachable'; fi

      - name: Check sitemap reachable (fallback)
        run: |
          if curl -I --max-time 10 https://devesh-portfolio-nine.vercel.app/sitemap.xml; then echo 'vercel reachable'; else echo 'fallback unreachable'; fi
