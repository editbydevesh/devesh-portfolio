name: Submit sitemap to Google Search Console

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC
  push:
    branches: [ main ]

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Validate OAuth secrets
        run: |
          if [ -z "${{ secrets.GSC_CLIENT_ID }}" ]; then echo "No GSC_CLIENT_ID secret found"; exit 1; fi
          if [ -z "${{ secrets.GSC_CLIENT_SECRET }}" ]; then echo "No GSC_CLIENT_SECRET secret found"; exit 1; fi
          if [ -z "${{ secrets.GSC_REFRESH_TOKEN }}" ]; then echo "No GSC_REFRESH_TOKEN secret found"; exit 1; fi
          if [ -z "${{ secrets.GSC_SITE_URL }}" ]; then echo "No GSC_SITE_URL secret found"; exit 1; fi

      - name: Create submit script
        run: |
          cat > submit-sitemap.js <<'JS'
const {google} = require('googleapis');
(async function(){
  const siteUrl = process.env.GSC_SITE_URL;
  try{
    const oauth2Client = new google.auth.OAuth2(
      process.env.GSC_CLIENT_ID,
      process.env.GSC_CLIENT_SECRET,
      'urn:ietf:wg:oauth:2.0:oob'
    );
    oauth2Client.setCredentials({ refresh_token: process.env.GSC_REFRESH_TOKEN });
    const client = oauth2Client;
    const searchconsole = google.searchconsole({version: 'v1', auth: client});
    const feedpath = '/sitemap.xml';
    console.log('Submitting', feedpath, 'for', siteUrl);
    const res = await searchconsole.sitemaps.submit({siteUrl, feedpath});
    console.log('Response:', res.status, res.data || 'OK');
  }catch(e){
    console.error('Submit failed', e);
    process.exit(1);
  }
})();
JS

      - name: Install dependencies
        run: npm install googleapis@119

      - name: Submit sitemap
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: node submit-sitemap.js
